<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("green-corner-theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>The Green Corner | Grill Pub in Nyamirambo, Kigali</title>
    <meta name="description" content="The Green Corner is a grill pub in Nyamirambo, Kigali known for fire-grilled fish, goat and beef brochettes, and ice-cold local beer." />
